name: build

on:
  push:
  pull_request:
  # Nightly rebuild of main. This is the drift detector: if an upstream
  # change moves an install path or a configure flag, this goes red the
  # next day rather than at the next release.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      xymon_ref:
        description: 'Ref to build: a branch, tag, sha, or pr/NNN'
        required: false
        default: 'main'
      # A published NEVRA is immutable, so a packaging-only fix to an
      # already-released version cannot rebuild -1; re-dispatch the same
      # tag with this bumped to ship it as -2.
      releasenum:
        description: 'Release number for a tag build (bump to re-release)'
        required: false
        default: '1'
      # One-off override of the retention in build/publish.sh, for
      # trimming the published tree by hand. The standing policy stays
      # whatever that script defaults to; this only changes the run it
      # is given to.
      snapshot_keep:
        description: 'Snapshot builds to keep per directory when publishing'
        required: false
        default: ''
      # Empties the snapshot channel before publishing, so it ends up
      # holding only this run's packages. Retention alone cannot do that:
      # it keeps every packaging rebuild of one upstream commit together.
      snapshot_reset:
        description: 'Set to 1 to drop all published snapshots and republish from this run'
        required: false
        default: ''

permissions:
  contents: read

env:
  XYMON_REF: ${{ github.event.inputs.xymon_ref || 'main' }}

jobs:
  rpm:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      # rpmbuild needs no privileges; running straight in a distro container
      # avoids mock's need for nspawn/loop devices on a hosted runner.
      options: --security-opt seccomp=unconfined
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      # Targets are pinned, never floating. A moving tag such as
      # fedora:latest silently changes the dist tag when a new release
      # comes out, which moves the published repository path underneath
      # users with no commit to point at. Adding or retiring a target is
      # a deliberate one-line change here.
      #
      # Fedora ships N and N-1; retire a release when it goes EOL rather
      # than accumulating dead trees.
      # Published EL builds run on AlmaLinux, a rebuild of *released* RHEL,
      # so they cannot pick up a symbol version RHEL does not ship. CentOS
      # Stream is the development branch for the next RHEL minor -- building
      # there risks a package that installs on Stream and fails on RHEL --
      # so Stream is carried as a canary instead.
      matrix:
        include:
          - name: el8
            image: almalinux:8
            family: el
          - name: el9
            image: almalinux:9
            family: el
          - name: el10
            image: almalinux:10
            family: el
          - name: fc43
            image: fedora:43
            family: fedora
          - name: fc44
            image: fedora:44
            family: fedora
          # Canaries: early warning for the next RHEL minor and the next
          # Fedora. Never published, and allowed to fail.
          - name: stream9
            image: quay.io/centos/centos:stream9
            family: el
            experimental: true
          - name: stream10
            image: quay.io/centos/centos:stream10
            family: el
            experimental: true
          - name: fedora-rawhide
            image: fedora:rawhide
            family: fedora
            experimental: true
          # Proves the SELinux policy still compiles. It is off by default
          # in the shipped packages because nothing here runs enforcing
          # SELinux, so this only demonstrates that the modules build --
          # not that they are correct. Without this leg the wiring would
          # never be exercised at all.
          - name: selinux
            image: almalinux:10
            family: el
            experimental: true
            rpmdefine: _with_selinux 1

    steps:
      # EL needs CRB (c-ares-devel) and EPEL (rrdtool-devel); Fedora has
      # everything in the base repos.
      - name: Enable build repositories
        run: |
          set -eux
          dnf -y install dnf-plugins-core git-core rpm-build rpmdevtools
          if [ "${{ matrix.family }}" = "el" ]; then
            ver=$(rpm -E %rhel)
            dnf -y install \
              "https://dl.fedoraproject.org/pub/epel/epel-release-latest-${ver}.noarch.rpm"
            # The CRB/PowerTools repo is named differently across EL versions.
            dnf config-manager --set-enabled crb 2>/dev/null \
              || dnf config-manager --set-enabled powertools 2>/dev/null \
              || dnf config-manager --set-enabled codeready-builder 2>/dev/null \
              || true
          fi

      - name: Checkout packaging
        uses: actions/checkout@v6

      # Accepts a branch, a tag, a sha, or a pull request -- either as
      # "pr/163" or as the full "refs/pull/163/head". A plain clone does not
      # fetch refs/pull/*, so a PR reference has to be asked for explicitly
      # before it can be checked out.
      - name: Checkout xymon source
        run: |
          set -eux
          git clone --filter=blob:none https://github.com/xymon-monitoring/xymon.git src
          case "${XYMON_REF}" in
          pr/*|refs/pull/*)
            pr=$(echo "${XYMON_REF}" | tr -dc '0-9')
            git -C src fetch origin "pull/${pr}/head:pr-${pr}"
            git -C src checkout "pr-${pr}"
            # Say which commit a PR build actually came from: the head of a
            # pull request moves, so "pr/163" alone does not identify a build.
            echo "::notice::built from PR #${pr} at $(git -C src rev-parse --short HEAD)"
            ;;
          *)
            git -C src checkout "${XYMON_REF}"
            ;;
          esac

      # A tagged release builds as X.Y.Z-1; anything else builds as a
      # pre-release of the upcoming version,
      # X.Y.Z-0.<date>git<sha>.<pkgdate>p<pkgsha>, which sorts below the
      # eventual -1. The first pair names the upstream commit, the second
      # the packaging commit: a published NEVRA is immutable, so without
      # the second pair a packaging-only change rebuilds the same NEVRA as
      # the previous run and is never published until upstream happens to
      # move. The datetime does the ordering (rpm compares sha segments
      # alphabetically, which means nothing); UTC so it only moves
      # forward. See README.md.
      - name: Compute version
        id: ver
        run: |
          set -eux
          base=$(cat rpm/baseversion)
          ref=$(git -C src rev-parse --short=7 HEAD)
          if tag=$(git -C src describe --exact-match --tags 2>/dev/null); then
            base="${tag#rel-}"
            echo "snapshot=" >> "$GITHUB_OUTPUT"
          else
            date=$(git -C src log -1 --format=%cd --date=format:%Y%m%d)
            # The packaging checkout is owned by the runner user, not the
            # container user, and git refuses mismatched ownership. src is
            # immune only because it was cloned inside the container.
            git config --global --add safe.directory "$(pwd)"
            pkgdate=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M)
            pkgref=$(git rev-parse --short=7 HEAD)
            echo "snapshot=0.${date}git${ref}.${pkgdate}p${pkgref}" >> "$GITHUB_OUTPUT"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Create source tarball
        run: |
          set -eux
          rpmdev-setuptree
          git -C src archive --format=tar \
              --prefix="xymon-${{ steps.ver.outputs.base }}/" HEAD \
            | gzip -9 > ~/rpmbuild/SOURCES/xymon-${{ steps.ver.outputs.base }}.tar.gz
          cp rpm/sources/* ~/rpmbuild/SOURCES/

      # A lua scriptlet with a syntax error (lua comments are --, not #)
      # fails the whole spec parse. rpmspec finds it in a second, before
      # a build has been spent on it.
      - name: Parse the spec
        run: rpmspec -P rpm/xymon.spec >/dev/null

      # The define has to reach builddep as well as rpmbuild: conditional
      # BuildRequires are invisible to dependency resolution otherwise, and
      # the build then fails on deps that were never asked for.
      - name: Install build dependencies
        run: |
          dnf -y builddep ${{ matrix.rpmdefine && format('-D "{0}"', matrix.rpmdefine) || '' }} \
            rpm/xymon.spec

      - name: Build
        run: |
          set -eux
          rpmbuild -ba rpm/xymon.spec \
            ${{ matrix.rpmdefine && format('--define "{0}"', matrix.rpmdefine) || '' }} \
            --define "baseversion ${{ steps.ver.outputs.base }}" \
            --define "releasenum ${{ github.event.inputs.releasenum || '1' }}" \
            ${{ steps.ver.outputs.snapshot && format('--define "gitsnapshot {0}"', steps.ver.outputs.snapshot) || '' }}

      - name: Verify version ordering
        run: ./tests/vercmp.sh

      - name: Collect packages
        run: |
          set -eux
          mkdir -p out
          find ~/rpmbuild/RPMS ~/rpmbuild/SRPMS -name '*.rpm' -exec cp {} out/ \;
          ls -l out

      # The two packages ship the same unit and the same client tree, and
      # a divergence between them is invisible to rpmbuild. Reads the
      # rpms only -- no install, no systemd. diffutils is not in the
      # minimal images.
      - name: Package checks
        run: |
          dnf -y install cpio diffutils
          ./tests/packages.sh out

      # A green rpmbuild says nothing about whether the package installs.
      - name: Install test
        run: ./tests/install.sh out

      # The prefix is what the publish job selects on. Canaries build and
      # install-test like everything else, but must never reach users: a
      # Stream build carries the same .el9/.el10 dist tag as the AlmaLinux
      # one, so publishing both would make it a race which of the two a
      # user receives.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.experimental && 'canary' || 'pub' }}-${{ matrix.name }}
          path: out/*.rpm
          if-no-files-found: error

  # The only test that exercises %pretrans, and the only one that sees
  # what a following user actually does: take the build they already
  # have and upgrade it to this one. Layout moves in this packaging have
  # repeatedly needed a directory cleared out of the way for a symlink,
  # which rpm refuses to do on its own and which fails the whole
  # transaction -- invisible to every other suite here, all of which
  # start from an empty root.
  #
  # The fixture is the published snapshot channel, so this is a rolling
  # N-1 -> N check: whatever the next layout change is, the push after
  # it exercises the migration automatically.
  upgrade:
    name: upgrade-${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: rpm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: el10
            image: almalinux:10
            artifact: pub-el10
          - name: fc44
            image: fedora:44
            artifact: pub-fc44
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out

      - name: Upgrade from the published build
        run: |
          set -eux
          docker run --rm -v "$PWD:/work:ro" ${{ matrix.image }} sh -c '
            dnf -y install curl >/dev/null &&
            cp -r /work/tests /work/out /tmp/ &&
            cd /tmp && ./tests/upgrade.sh /tmp/out'

  # What a host's role change does to systemd's state -- enablement,
  # stop ordering, which drop-in is in effect. The rpm job cannot test
  # any of it: its container has no PID 1, so every systemctl call in a
  # scriptlet no-ops behind `|| :` and the scriptlets pass by doing
  # nothing. This job runs on the runner itself and starts a privileged
  # systemd container, which needs the host's cgroup namespace.
  #
  # One representative target per family rather than the full matrix:
  # the scriptlets are identical everywhere, and this is about their
  # interaction with systemd, not with a distro's package set.
  systemd-lifecycle:
    name: systemd-${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: rpm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: el10
            image: almalinux:10
            artifact: pub-el10
          - name: fc44
            image: fedora:44
            artifact: pub-fc44
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out

      - name: Run the lifecycle test under systemd
        run: |
          set -eux
          # The base images cannot be booted as they are: Fedora's ships
          # no systemd at all, and an image that has it still needs the
          # manager as PID 1. Derive one that can.
          docker build -t xymon-systemd - <<EOF
          FROM ${{ matrix.image }}
          RUN dnf -y install systemd && dnf clean all
          CMD ["/usr/lib/systemd/systemd"]
          EOF
          docker run -d --name sd --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/work:ro" xymon-systemd
          # systemd needs a moment before it will answer; fail rather
          # than run the assertions against a half-started manager.
          for i in $(seq 30); do
            state=$(docker exec sd systemctl is-system-running 2>/dev/null || true)
            case "$state" in running|degraded) break ;; esac
            sleep 2
          done
          case "$state" in running|degraded) ;; *) echo "systemd did not come up: $state"; exit 1 ;; esac
          docker exec sd cp -r /work/tests /work/out /tmp/
          docker exec -w /tmp sd ./tests/systemd.sh /tmp/out

      - name: Stop the container
        if: always()
        run: docker rm -f sd || true

  publish:
    name: publish
    # The lifecycle test gates publishing as much as the build does:
    # broken swap semantics are exactly the kind of defect that is
    # invisible in a package and painful on a running host.
    needs: [rpm, systemd-lifecycle, upgrade]
    # Publish only genuine builds of xymon's main branch or of a release
    # tag.
    #
    # Never from a pull request against this repository: a fork must not be
    # able to reach the signing key or write to the published tree. And
    # never from a manual run of some other ref -- a workflow_dispatch still
    # reports github.ref as refs/heads/main, so without the last clause a
    # one-off build of a branch or pull request would be published as though
    # it were main. A dispatched rel-* ref IS the release flow, so it
    # publishes; if someone names an upstream *branch* rel-*, the Compute
    # version step still versions it as a snapshot (only an exact tag match
    # builds as X.Y.Z-n), so it cannot impersonate a release.
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && (github.event.inputs.xymon_ref == ''
          || github.event.inputs.xymon_ref == null
          || github.event.inputs.xymon_ref == 'main'
          || startsWith(github.event.inputs.xymon_ref, 'rel-'))
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    permissions:
      contents: write
    # Two overlapping runs (a nightly and a push) would both clone
    # gh-pages, and the second to push would be rejected as
    # non-fast-forward -- leaving that run's packages silently
    # unpublished. Serialize the job instead.
    concurrency:
      group: publish-gh-pages
      cancel-in-progress: false
    steps:
      - name: Install tooling
        run: dnf -y install createrepo_c rpm-sign rpm-build rpmdevtools gnupg2 git-core findutils

      - name: Checkout packaging
        uses: actions/checkout@v6

      # The secrets context is not available to a job-level `if`, so the
      # job always starts and stops here until a key is configured. That
      # keeps the run green rather than showing a permanent red job while
      # signing is still being set up.
      - name: Check for a signing key
        id: key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No GPG_PRIVATE_KEY secret configured; nothing published. See docs/signing.md."
          fi

      - name: Import the signing key
        if: steps.key.outputs.ok == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -eu
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')
          # The key carries no passphrase: it would have to be stored in a
          # second secret beside the key itself, so it would guard nothing
          # that reading the first secret does not already give away. See
          # docs/signing.md.
          printf '%%_gpg_name %s\n' "$keyid" > "$HOME/.rpmmacros"

      - name: Download all packages
        if: steps.key.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: pub-*
          path: artifacts

      - name: Check out the published repository
        if: steps.key.outputs.ok == 'true'
        run: |
          set -eu
          git config --global --add safe.directory '*'
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            published 2>/dev/null || {
              echo "gh-pages does not exist yet; creating it"
              git clone --depth 1 \
                "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
                published
              git -C published checkout --orphan gh-pages
              git -C published rm -rq --cached . || true
              find published -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            }

      - name: Sign and publish
        if: steps.key.outputs.ok == 'true'
        env:
          # Empty means "leave it to publish.sh", so a normal push keeps
          # the standing retention.
          XYMON_SNAPSHOT_KEEP: ${{ github.event.inputs.snapshot_keep }}
          XYMON_SNAPSHOT_RESET: ${{ github.event.inputs.snapshot_reset }}
        run: |
          set -eu
          ./build/publish.sh artifacts published
          cp RPM-GPG-KEY-xymon published/RPM-GPG-KEY-xymon
          ./build/mkrepofile.sh remote > published/xymon.repo

          # The bootstrap package. Built here rather than in the matrix
          # because it is noarch and carries no dist tag, so one build
          # serves every target -- and it needs the signing key, which
          # only this job has. Its copy of the repo file points at the key
          # it installs itself, so adding the repository needs no network
          # fetch of the key and no trust decision by the user.
          rpmdev-setuptree
          ./build/mkrepofile.sh local > ~/rpmbuild/SOURCES/xymon.repo
          cp RPM-GPG-KEY-xymon ~/rpmbuild/SOURCES/
          rpmbuild -bb rpm/xymon-release.spec
          rpm --addsign ~/rpmbuild/RPMS/noarch/xymon-release-*.rpm
          # Same immutability rule as every other package: a published
          # NEVRA is never overwritten. Shipping a changed repo file or
          # key means bumping Version in rpm/xymon-release.spec.
          for f in ~/rpmbuild/RPMS/noarch/xymon-release-*.rpm; do
            b=$(basename "$f")
            if [ -e "published/$b" ]; then
              echo "already published, leaving alone: $b"
            else
              cp -p "$f" "published/$b"
            fi
          done
          # GitHub Pages has no autoindex, so without these every directory
          # in a browser is a bare 404.
          ./build/mkindex.sh published
          # Pages would otherwise run the tree through Jekyll, which drops
          # directories beginning with an underscore and rewrites nothing
          # we want rewritten.
          touch published/.nojekyll

      - name: Commit and push
        if: steps.key.outputs.ok == 'true'
        run: |
          set -eu
          cd published
          git config user.name "xymon-rpm publisher"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to publish"
          else
            git commit -m "Publish packages from ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi
