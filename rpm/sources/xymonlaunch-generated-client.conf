# Drop-in for the generated unit (xymon#415) in the client package. Beyond the
# common differences (ExecStart via xymonlaunch-run, RuntimeDirectoryPreserve,
# the restored alias), the client waits for the network, reads its own
# EnvironmentFile, and reverts the kill to control-group so it kills its
# children on stop -- the generated base bakes KillMode=process for both roles.
[Unit]
Wants=network-online.target
After=network-online.target
[Service]
ExecStart=
ExecStart=/usr/lib/xymon/client/bin/xymonlaunch-run $XYMONLAUNCHOPTS
RuntimeDirectoryPreserve=yes
KillMode=control-group
SendSIGKILL=yes
EnvironmentFile=-/etc/sysconfig/xymon-client
[Install]
Alias=xymon.service
