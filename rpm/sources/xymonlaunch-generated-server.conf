# Drop-in for the generated unit (xymon#415) in the server package. The
# generated base already carries the server's kill (KillMode=process,
# SendSIGKILL=no), so this only adds this packaging's other differences:
# ExecStart dispatches the role through xymonlaunch-run,
# RuntimeDirectoryPreserve keeps /run/xymon across restarts, and the
# xymon.service alias is restored (the generated unit ships none).
[Service]
ExecStart=
ExecStart=/usr/lib/xymon/client/bin/xymonlaunch-run $XYMONLAUNCHOPTS
RuntimeDirectoryPreserve=yes
[Install]
Alias=xymon.service
