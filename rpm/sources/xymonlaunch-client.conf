# Client-role drop-in for xymonlaunch.service, shipped only by the
# xymon-client package. A client exists solely to report over the
# network, so wait for it at boot; the server (a listening daemon whose
# tasks retry on an interval) deliberately does not take this
# dependency, because wait-online can stall its boot by minutes.

[Unit]
Wants=network-online.target
After=network-online.target
